# ---------------------------------------------------------------- cuisines
cuisine_synonyms:              # raw value (OSM or Google-derived) -> canonical code
  coffee_shop: coffee
  cafe: coffee
  regional: quebecois
  local: quebecois
  hamburger: burger
  dumpling: dumplings
  italian_pizza: pizza
  noodle: noodles
  fish: seafood
  wings: chicken
  steak_house: steakhouse
  latin_american: latin

cuisine_drop: [restaurant, food, international, fine_dining, lunch, fusion, grill, meat, fast_food, bar, pub]

cuisine_vocabulary:            # codes kept after normalization; anything else is dropped
  [pizza, coffee, burger, sandwich, sushi, italian, vietnamese, chicken, chinese, indian,
   japanese, mexican, asian, breakfast, brunch, bubble_tea, lebanese, french, korean, kebab,
   thai, greek, mediterranean, ice_cream, portuguese, seafood, poke, barbecue, bagel, hot_dog,
   quebecois, caribbean, pasta, american, poutine, cake, salad, bistro, ramen, fries,
   middle_eastern, turkish, shawarma, juice, pastry, peruvian, steakhouse, hawaiian, crepe,
   donut, dessert, african, haitian, tapas, soup, filipino, tea, dumplings, latin, moroccan,
   spanish, noodles, persian, pakistani, syrian, tunisian, deli, smoked_meat, european,
   taiwanese, falafel, brazilian, arab, tacos, belgian, creole, cambodian, russian, smoothie,
   waffle, polish, ethiopian, jamaican, afghan, cuban, malaysian, indonesian, cantonese,
   sichuan, hot_pot, laotian, salvadorian, colombian, venezuelan, argentinian, german,
   irish, british, ukrainian, georgian, armenian, iranian, iraqi, egyptian, senegalese,
   nepalese, sri_lankan, bangladeshi, tibetan, mongolian, uzbek, yemeni, israeli, jewish]

google_type_suffixes: ["_restaurant", "_shop"]   # e.g. chinese_restaurant -> chinese
google_type_synonyms:
  hamburger_restaurant: burger
  bagel_shop: bagel
  coffee_shop: coffee
  cafe: coffee
  tea_house: tea
  ice_cream_shop: ice_cream
  dessert_shop: dessert
  donut_shop: donut
  sandwich_shop: sandwich
  juice_shop: juice
  steak_house: steakhouse
  pastry_shop: pastry
  cake_shop: cake
  breakfast_restaurant: breakfast
  brunch_restaurant: brunch
  barbecue_restaurant: barbecue
google_type_to_dietary:
  vegan_restaurant: VEGAN
  vegetarian_restaurant: VEGETARIAN

cuisine_groups:                # onboarding chips; order = display order
  - {code: taste_of_mtl,     icon: "restaurant_menu", fr: "Saveurs de Montréal",          en: "Taste of Montréal",               cuisines: [bagel, poutine, quebecois, deli, smoked_meat]}
  - {code: french,           icon: "bakery_dining", fr: "Français et bistro",           en: "French & Bistro",                 cuisines: [french, bistro, crepe]}
  - {code: japanese_korean,  icon: "set_meal", fr: "Japonais et coréen",           en: "Japanese & Korean",               cuisines: [japanese, sushi, ramen, korean, poke]}
  - {code: chinese_se_asian, icon: "ramen_dining", fr: "Chinois et Asie du Sud-Est",   en: "Chinese & SE Asian",              cuisines: [chinese, dumplings, vietnamese, thai, cambodian, asian, taiwanese, noodles, cantonese, sichuan, hot_pot, laotian, malaysian, indonesian, filipino]}
  - {code: italian_pizza,    icon: "local_pizza", fr: "Italien et pizza",             en: "Italian & Pizza",                 cuisines: [italian, pizza, pasta]}
  - {code: middle_eastern,   icon: "outdoor_grill", fr: "Moyen-Orient et Méditerranée", en: "Middle Eastern & Mediterranean",  cuisines: [lebanese, greek, mediterranean, middle_eastern, turkish, kebab, shawarma, falafel, syrian, persian, iranian, moroccan, tunisian, arab, armenian, israeli]}
  - {code: latin_caribbean,  icon: "local_fire_department", fr: "Latino et Caraïbes",          en: "Latin & Caribbean",               cuisines: [mexican, caribbean, haitian, peruvian, portuguese, latin, brazilian, tacos, creole, jamaican, cuban, salvadorian, colombian, venezuelan, argentinian]}
  - {code: south_asian,      icon: "rice_bowl", fr: "Indien et Asie du Sud",        en: "Indian & South Asian",            cuisines: [indian, pakistani, nepalese, sri_lankan, bangladeshi, afghan, tibetan]}
  - {code: quick_bites,      icon: "fastfood", fr: "Sur le pouce",                 en: "Quick Bites",                     cuisines: [burger, chicken, sandwich, hot_dog, fries]}
  - {code: cafe_sweets,      icon: "local_cafe", fr: "Cafés et douceurs",            en: "Cafés & Sweets",                  cuisines: [coffee, tea, bubble_tea, cake, pastry, dessert, ice_cream, donut, waffle, crepe, juice, smoothie]}
  - {code: bars,             icon: "local_bar", fr: "Bars et pubs",                 en: "Bars & Pubs",                     venue_type: BAR}

# ---------------------------------------------------------------- price
price_brackets:                # per person, CAD; max is exclusive, matched on the place's price_max
  - {code: UNDER_20,  label: "< $20",  max: 20}
  - {code: UNDER_50,  label: "< $50",  max: 50}
  - {code: UNDER_100, label: "< $100", max: 100}
  - {code: ANY,       label: "$100+",  max: null}

price_level_estimate:          # fallback when Google has priceLevel but no priceRange
  PRICE_LEVEL_INEXPENSIVE:    [0, 20]
  PRICE_LEVEL_MODERATE:       [20, 50]
  PRICE_LEVEL_EXPENSIVE:      [50, 100]
  PRICE_LEVEL_VERY_EXPENSIVE: [100, null]

# ---------------------------------------------------------------- Google venue rules
# Applied to the Google primaryType of a matched place, after enrichment (no extra API cost).
google_venue_rules:
  drop:    # concession stands inside venues: not tourist restaurants -> removed at import
    [arena, stadium, movie_theater, performing_arts_theater, event_venue, sports_club,
     association_or_organization, catering_service, convention_center, concert_hall,
     amusement_center, sports_complex, university, school, hospital]
  strip:   # matched the building, not the restaurant -> keep the place, ignore the Google data
    [hotel, food_store, grocery_store, supermarket, shopping_mall, lodging]
