# Reference data for the Montréal food ETL.
# Every business rule that the team may want to change lives here, not in code.

# ---------------------------------------------------------------- geography
boroughs:
  # code: [name_fr, name_en, [aliases seen in the City file "city" column]]
  # A place belongs to the City only if it falls in one of these polygons.
  # Aliases are used (a) as a fallback filter when no boundary file is given and
  # (b) to sanity-check polygon results. "Montréal" is shared by many boroughs.
  ahuntsic-cartierville:        ["Ahuntsic-Cartierville", "Ahuntsic-Cartierville", ["Montréal"]]
  anjou:                        ["Anjou", "Anjou", ["Anjou"]]
  cote-des-neiges-ndg:          ["Côte-des-Neiges–Notre-Dame-de-Grâce", "Côte-des-Neiges–Notre-Dame-de-Grâce", ["Montréal"]]
  lachine:                      ["Lachine", "Lachine", ["Lachine"]]
  lasalle:                      ["LaSalle", "LaSalle", ["LaSalle"]]
  plateau-mont-royal:           ["Le Plateau-Mont-Royal", "Plateau-Mont-Royal", ["Montréal"]]
  sud-ouest:                    ["Le Sud-Ouest", "Le Sud-Ouest", ["Montréal"]]
  ile-bizard-sainte-genevieve:  ["L'Île-Bizard–Sainte-Geneviève", "L'Île-Bizard–Sainte-Geneviève", ["L'Ile Bizard", "Ste-Geneviève"]]
  mercier-hochelaga-maisonneuve: ["Mercier–Hochelaga-Maisonneuve", "Mercier–Hochelaga-Maisonneuve", ["Montréal"]]
  montreal-nord:                ["Montréal-Nord", "Montréal-Nord", ["Montréal-Nord"]]
  outremont:                    ["Outremont", "Outremont", ["Outremont"]]
  pierrefonds-roxboro:          ["Pierrefonds-Roxboro", "Pierrefonds-Roxboro", ["Pierrefonds", "Roxboro"]]
  rdp-pat:                      ["Rivière-des-Prairies–Pointe-aux-Trembles", "Rivière-des-Prairies–Pointe-aux-Trembles", ["Rivière-des-Prairies", "Pointe-aux-Trembles"]]
  rosemont-petite-patrie:       ["Rosemont–La Petite-Patrie", "Rosemont–La Petite-Patrie", ["Montréal"]]
  saint-laurent:                ["Saint-Laurent", "Saint-Laurent", ["St-Laurent"]]
  saint-leonard:                ["Saint-Léonard", "Saint-Léonard", ["St-Léonard"]]
  verdun:                       ["Verdun", "Verdun", ["Verdun"]]
  ville-marie:                  ["Ville-Marie", "Ville-Marie", ["Montréal"]]
  villeray-saint-michel-parc-extension: ["Villeray–Saint-Michel–Parc-Extension", "Villeray–Saint-Michel–Parc-Extension", ["Montréal"]]

# ---------------------------------------------------------------- venue types
city_type_to_venue:            # City "type" -> venue_type. Types not listed are not imported.
  "Restaurant": RESTAURANT
  "Restaurant service rapide": FAST_FOOD
  "Casse-croûte": FAST_FOOD
  "Restaurant mets pour emporter": FAST_FOOD
  "Bar salon, taverne": BAR
  "Brasserie": BAR
  "Café, thé, infusion, tisane": CAFE
  "Pâtisserie/Boulangerie": BAKERY
  "Boulangerie": BAKERY
  "Bar laitier": DESSERT
  "Bar laitier saisonnier": DESSERT
  "Camion-cuisine": FOOD_TRUCK

osm_amenity_to_venue:          # preferred over the City type when the place is matched to OSM
  restaurant: RESTAURANT
  fast_food: FAST_FOOD
  cafe: CAFE
  bar: BAR
  pub: BAR
  ice_cream: DESSERT

venue_type_slots:              # which planner slots each venue type may fill
  RESTAURANT: [BREAKFAST, LUNCH, DINNER]   # breakfast only with breakfast/brunch cuisine (planner rule)
  FAST_FOOD:  [LUNCH, DINNER, SNACK]
  CAFE:       [BREAKFAST, SNACK]
  BAKERY:     [BREAKFAST, SNACK]
  DESSERT:    [SNACK]
  FOOD_TRUCK: [LUNCH, SNACK]
  BAR:        [EVENING]

# ---------------------------------------------------------------- matching
matching:
  max_distance_m: 80
  min_name_score: 0.75
  review_band: [0.75, 0.85]     # matches in this band are written to the review report
  chain_candidate_min_locations: 3

# ---------------------------------------------------------------- brands
# decision: ALLOW keeps the place (is_chain = true); BLOCK removes it at import.
# Any OSM "brand" that is not listed here is treated as BLOCK.
# name_match: false -> only the OSM brand tag is used (for names that are also common words).
# out/review_chain_candidates.csv lists names found at 3+ addresses that are not decided yet.
brands:
  # ---- Québec-local chains (ALLOW)
  - {name: "La Belle Province",   decision: ALLOW}
  - {name: "Restaurants Lafleur", decision: ALLOW, aliases: ["Lafleur"]}
  - {name: "Café Dépôt",          decision: ALLOW}
  - {name: "Allô! Mon Coco",      decision: ALLOW, aliases: ["Allo Mon Coco"]}
  - {name: "Poutineville",        decision: ALLOW}
  - {name: "Frite Alors!",        decision: ALLOW}
  - {name: "Benny & Co.",         decision: ALLOW}
  - {name: "L'Oeufrier",          decision: ALLOW}
  - {name: "La Cage",             decision: ALLOW}
  - {name: "Scores",              decision: ALLOW}
  - {name: "Pacini",              decision: ALLOW}
  - {name: "Cultures",            decision: ALLOW}
  - {name: "Boustan",             decision: ALLOW}
  - {name: "Marius",              decision: ALLOW, name_match: false}   # "Marius et Fanny" is unrelated
  - {name: "Jack Le Coq",         decision: ALLOW}
  # ---- Québec-founded but large franchise networks (BLOCK, team decision)
  - {name: "Thaï Express",  decision: BLOCK, aliases: ["Thai Express"]}
  - {name: "Sushi Shop",    decision: BLOCK}
  - {name: "Mikes",         decision: BLOCK}
  - {name: "Valentine",     decision: BLOCK}
  - {name: "St-Hubert",     decision: BLOCK, aliases: ["St Hubert", "Rotisserie St-Hubert"]}
  - {name: "Cora",          decision: BLOCK, aliases: ["Chez Cora"]}
  # ---- Canadian national chains (BLOCK)
  - {name: "Tim Hortons",   decision: BLOCK, aliases: ["Tim Horton"]}
  - {name: "A&W",           decision: BLOCK, aliases: ["A & W"]}
  - {name: "Pizza Pizza",   decision: BLOCK}
  - {name: "Second Cup",    decision: BLOCK}
  - {name: "Harvey's",      decision: BLOCK}
  - {name: "Mucho Burrito", decision: BLOCK}
  - {name: "Osmow's",       decision: BLOCK}
  - {name: "Jugo Juice",    decision: BLOCK, aliases: ["Jus Jugo Juice"]}
  - {name: "Boston Pizza",  decision: BLOCK}
  - {name: "Bento Sushi",   decision: BLOCK}
  - {name: "Teriyaki Experience", decision: BLOCK}
  - {name: "Quesada",       decision: BLOCK}
  - {name: "Real Fruit Bubble Tea", decision: BLOCK}
  - {name: "The Keg",       decision: BLOCK}
  - {name: "Manchu Wok",    decision: BLOCK}
  # ---- International chains (BLOCK)
  - {name: "McDonald's",    decision: BLOCK, aliases: ["McDonalds", "Restaurant McDonald's"]}
  - {name: "Subway",        decision: BLOCK}
  - {name: "Starbucks",     decision: BLOCK}
  - {name: "Domino's",      decision: BLOCK, aliases: ["Dominos", "Domino's Pizza"]}
  - {name: "Pizza Hut",     decision: BLOCK}
